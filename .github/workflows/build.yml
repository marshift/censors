name: Build

on:
  push:
    branches: [master]

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            filename: censors.exe

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            filename: censors

          - target: aarch64-apple-darwin
            os: macos-latest
            filename: censors

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Set up MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install --yes --no-install-recommends g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64-win32

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: censors-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.filename }}
